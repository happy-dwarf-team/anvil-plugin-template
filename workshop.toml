# Publishing the plugin as a Steam Workshop mod with paradox-workshop-publish
# (https://github.com/happy-dwarf-team/paradox-workshop-publish).
#
# The mod is workshop/: descriptor.mod, thumbnail.png and anvil/<id>/, the
# built plugin, which CI copies there (it is not in Git). The Workshop item ID
# is remote_file_id in workshop/descriptor.mod, written once by `pdx-ws init`.
# Without `description` and `visibility`, publishing never changes them on Steam.
schema = 1

[[mod]]
game = "eu4"
path = "workshop"
# A mod of only descriptor.mod and anvil/ keeps the EU4 checksum, so players
# keep ironman achievements. A change that would break that fails the plan.
checksum = "keep"
