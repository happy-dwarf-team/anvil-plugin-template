# Every game address the plugin uses, declared once. `anvil gen` turns it into
# symbols.gen.h and symbols.gen.hpp; Anvil verifies it against eu4.exe before
# loading the DLL and skips the plugin on any other build. After a change, run
# the my_plugin-check target with EU4_EXE set, once with each build's eu4.exe,
# and commit symbols.lock.
#
# Two builds: Steam 1.37.5 and GOG 1.37.5.2. What a symbol is (memory,
# signature, note) is written once; only where it is (rva, bytes) may differ
# per build. To support one build only, write `build = "<id>"` instead of
# `builds` and give rva and bytes directly, as before Anvil 1.7.
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64"]

[symbol.speed_object]
memory = "code"
signature = "void* (void* session)"
note = "session vtable slot 0x100: returns the game-speed object"

[symbol.speed_object.build."eu4-1.37.5-steam-win64"]
rva = 0x8024D0
bytes = "48 8B 81 18 04 00 00 C3"      # mov rax, [rcx+0x418]; ret

[symbol.speed_object.build."eu4-1.37.5.2-gog-win64"]
rva = 0x801850
bytes = "48 8B 81 08 04 00 00 C3"      # mov rax, [rcx+0x408]; ret: the field is 0x10 lower on GOG

[symbol.idle_exit]
bytes = "48 8D 8D 40 02 00 00"         # lea rcx, [rbp+0x240]; the same on both builds
memory = "code"
note = "CInGameIdler::Idle, start of the block that returns to the menu"
build."eu4-1.37.5-steam-win64" = { rva = 0x815CAE }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x81500E }
