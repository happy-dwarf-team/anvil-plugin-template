# Every game address the plugin uses, declared once. `anvil gen` turns it into
# symbols.gen.h and symbols.gen.hpp; Anvil verifies it against eu4.exe before
# loading the DLL and skips the plugin on any other build. After a change, run
# the my_plugin-check target with EU4_EXE set, once with each build's eu4.exe,
# and commit symbols.lock.
#
# Each symbol is verified by `sha256` and `size`: the SHA-256 of the `size` bytes
# at its address, so this file holds no copy of the game's code. While you work,
# write the bytes you expect as `bytes = "48 8B ..."` (`??` for a byte that may
# differ), then run Anvil's tools/symbols-to-digest.py on this file before you
# commit. Describe the game's code by its address and what it does.
#
# Two builds: Steam 1.37.5 and GOG 1.37.5.2. What a symbol is (memory,
# signature, note) is written once; only where it is (rva, sha256, size) may
# differ per build. To support one build only, write `build = "<id>"` instead
# of `builds` and give rva, sha256 and size directly.
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64"]

[symbol.speed_object]
memory = "code"
signature = "void* (void* session)"
note = "session vtable slot 0x100: returns the game-speed object"

[symbol.speed_object.build."eu4-1.37.5-steam-win64"]
rva = 0x8024D0
sha256 = "AE4C23FB37CE181F11EF2E3EAF4BAC498572CD06FA1783BB0BBCFE0FE93A1407"
size = 8      # returns the game-speed object, a field at session+0x418

[symbol.speed_object.build."eu4-1.37.5.2-gog-win64"]
rva = 0x801850
sha256 = "8F07B1074C83410F33EBF37059EF5D88E560BD1B81DECD74D35506EC5408E384"
size = 8      # the same getter; the field is 0x10 lower on GOG, at session+0x408

[symbol.idle_exit]
sha256 = "FB0ECFE605355C97E7DE153CE7ACC9327AD2800E058AF3193D2DA4340EFCDF1E"
size = 7         # the same bytes on both builds
memory = "code"
note = "inside the in-game loop's per-frame step: start of the block that returns to the main menu"
build."eu4-1.37.5-steam-win64" = { rva = 0x815CAE }
build."eu4-1.37.5.2-gog-win64" = { rva = 0x81500E }
