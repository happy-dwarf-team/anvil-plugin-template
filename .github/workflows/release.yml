name: release

# release-please keeps a "chore: release x.y.z" pull request up to date from the
# Conventional Commits on main (version.txt, the version in plugin.toml and
# workshop/descriptor.mod, and CHANGELOG.md). Merging it tags vX.Y.Z and creates
# a DRAFT GitHub release; the jobs below then build that commit and attach the
# plugin zip and the Workshop zip to the draft. Publishing the draft on GitHub
# makes the release public and starts workshop-publish.yml.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # The template itself is not released; repositories created from it are.
    if: github.repository != 'happy-dwarf-team/anvil-plugin-template'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token the release PR does not trigger CI (GitHub does not
      # start workflows from GITHUB_TOKEN events). A RELEASE_PLEASE_TOKEN secret
      # (fine-grained token or GitHub App token) makes the checks run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-${{ github.sha }}
          path: dist

      - name: Prepare release assets
        working-directory: dist
        run: |
          # The zips are named after plugin.toml's version, which the release PR set.
          ls -- *"-${TAG#v}.zip" *"-${TAG#v}-workshop.zip" > /dev/null || {
            echo "::error::the zips do not carry the version of ${TAG}: $(ls)"
            exit 1
          }
          sha256sum -- *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed build provenance: `gh attestation verify <zip> -R <owner>/<repo>`.
      # GitHub offers attestations to public repositories on every plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      # gh finds a draft release by its tag too (contents: write can see drafts).
      - name: Upload release assets
        working-directory: dist
        run: gh release upload "$TAG" -- *.zip SHA256SUMS.txt --clobber
