# What the player can change. `anvil gen` turns it into settings.gen.hpp
# (cfg::log_menu_returns); Anvil keeps the player's values that differ from
# these defaults in anvil/data/<id>/settings.toml.
[setting.log_menu_returns]
type = "bool"
default = true
label = "Log each return to the menu"
description = "Writes a line to anvil.log whenever the game returns to the main menu."
restart = false               # applies at once: the plugin reads it on every return
# Anvil 1.23 also reads, each optional (set anvil = ">=1.23.0" in plugin.toml first):
# advanced = true             # folded under "Advanced" in the overlay and the Manager
# module = "<module id>"      # the setting of a module of plugin.toml, shown under it
# affects_gameplay = false    # in a plugin that changes the game: this one does not, so it
#                             # stays out of the multiplayer code and is not locked there

# A setting you remove can set its module's switch once, for the players who had saved it:
# [retired.old_mode]
# module = "<module id>"
# off = ["off"]               # these saved values turn the module off
# on = ["on"]                 # these turn it on (also a module with default = false)
# ironman = [true]            # these allow it in ironman (the module offers the opt-in)
# multiplayer = [true]        # these allow it in multiplayer (likewise)
